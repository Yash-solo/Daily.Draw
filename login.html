<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-page</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <div class="container-login">
            <h1>Login <span style="color:rgb(255, 29, 255)">Here</span>
            </h1>
            <p>Login if you already sign in.</p>
            <p>Welcome back to your own artist marketplace where art meets passion as artists.</p>
            <input type="text" placeholder="Enter your email address here" class="login-inputs-email">
            <input type="text" placeholder="Enter your Id password" class="login-inputs-password">
            <button class="login-enter" onclick="validateLogin()">Enter</button>
            <script src="login.js"></script>
        </div>
    </div>

</body>

</html>
